<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F766E">
<title>মালামাল ক্রয়ের হিসাব — হিসাবের খাতা</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230F766E'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E0%A6%B9%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/goods.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/sync.js"></script>
</head>
<body>

<div class="app">

  <!-- ========== HEADER ========== -->
  <div class="header" style="background:linear-gradient(135deg,#0F766E 0%,#14B8A6 100%);box-shadow:0 2px 12px rgba(15,118,110,0.2);">
    <button class="back-btn" onclick="goHomePage()">←</button>
    <h1>মালামাল ক্রয়ের হিসাব</h1>
  </div>

  <!-- ========== FORM TAB ========== -->
  <div id="formTab" class="screen" style="padding-bottom:100px;">
    <div class="form-card">
      <h2>
        <span id="formTitle">নতুন এন্ট্রি যোগ করুন</span>
        <span id="editBadge" class="edit-badge" style="display:none;">এডিট মোড</span>
      </h2>

      <input type="hidden" id="editId">

      <div class="form-group">
        <label>তারিখ <span class="req">*</span></label>
        <input type="date" id="fDate">
        <div class="date-bn" id="dateBn"></div>
      </div>

      <div class="form-group">
        <label>দোকানের নাম <span class="req">*</span></label>
        <input type="text" id="fShopName" placeholder="দোকানের নাম লিখুন">
      </div>

      <div class="form-group">
        <label>বিবরণ <span class="opt">(ঐচ্ছিক)</span></label>
        <input type="text" id="fDescription" placeholder="সংক্ষিপ্ত বিবরণ লিখুন">
      </div>

      <div class="form-group">
        <label>মূল্য <span class="req">*</span></label>
        <input type="number" id="fPrice" placeholder="0" min="0" step="0.01" inputmode="decimal">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>নগদ</label>
          <input type="number" id="fCash" placeholder="0" min="0" step="0.01" inputmode="decimal">
        </div>
        <div class="form-group">
          <label>বাকি</label>
          <input type="number" id="fDue" placeholder="0" min="0" step="0.01" inputmode="decimal">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>বাকি প্রদান</label>
          <input type="number" id="fPaid" placeholder="0" min="0" step="0.01" inputmode="decimal">
        </div>
        <div class="form-group">
          <label>খরচ</label>
          <input type="number" id="fCost" placeholder="0" min="0" step="0.01" inputmode="decimal">
        </div>
      </div>

      <div class="form-group">
        <label>মন্তব্য <span class="opt">(ঐচ্ছিক)</span></label>
        <textarea id="fNote" placeholder="অতিরিক্ত মন্তব্য"></textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-cancel" onclick="cancelForm()">Cancel</button>
        <button class="btn btn-save" onclick="saveEntry()" style="background:#0F766E;">Save</button>
        <button class="btn btn-delete" id="deleteBtn" onclick="deleteCurrent()" style="display:none;">Delete</button>
      </div>
    </div>
  </div>

  <!-- ========== STATISTICS TAB ========== -->
  <div id="statsTab" class="screen hidden" style="padding-bottom:100px;">

    <div class="selection-bar" id="selectionBar" style="background:#0F766E;">
      <div class="count" id="selCount">০টি নির্বাচিত</div>
      <button class="select-all" onclick="toggleSelectAll()">সব</button>
      <button onclick="exitSelectMode()">Cancel</button>
      <button class="danger" onclick="deleteSelected()">Delete</button>
    </div>

    <div class="toolbar">
      <input type="text" class="search-box" id="searchBox" placeholder="🔍 দোকান, বিবরণ বা মন্তব্য খুঁজুন..." oninput="renderTable()">

      <div class="toolbar-row">
        <button class="tool-btn" id="filterBtn" onclick="toggleDropdownPanel('filterPanel','filterBtn')">▼ ফিল্টার</button>
        <button class="tool-btn" id="sortBtn" onclick="toggleDropdownPanel('sortPanel','sortBtn')">↕ সর্ট</button>
        <button class="tool-btn export" onclick="exportCSV()">📥 CSV</button>
        <button class="tool-btn select" id="selectBtn" onclick="enterSelectMode()">☑ Select</button>
      </div>

      <div class="dropdown-panel" id="filterPanel">
        <h4>মাস ফিল্টার</h4>
        <select id="filterMonth" onchange="renderTable()">
          <option value="">সব মাস</option>
        </select>

        <h4 style="margin-top:10px;">দোকানের নাম</h4>
        <select id="filterShopName" onchange="renderTable()">
          <option value="">সব দোকান</option>
        </select>

        <div class="checkbox-row" style="margin-top:8px;">
          <input type="checkbox" id="filterDuplicate" onchange="renderTable()">
          <label for="filterDuplicate" style="cursor:pointer;font-size:13.5px;">শুধু ডুপ্লিকেট দোকান দেখান</label>
        </div>
      </div>

      <div class="dropdown-panel" id="sortPanel">
        <h4>সর্ট করুন</h4>
        <select id="sortBy" onchange="renderTable()">
          <option value="date-desc">তারিখ (নতুন → পুরনো)</option>
          <option value="date-asc">তারিখ (পুরনো → নতুন)</option>
          <option value="price-desc">মূল্য (বেশি → কম)</option>
          <option value="price-asc">মূল্য (কম → বেশি)</option>
          <option value="due-desc">বাকি (বেশি → কম)</option>
          <option value="shopname">দোকানের নাম</option>
        </select>
      </div>
    </div>

    <!-- SUMMARY GRID (2x2) -->
    <div class="goods-summary-grid">
      <div class="goods-summary-box gs-purchase">
        <div class="gs-label" id="labelPurchase">মোট ক্রয়</div>
        <div class="gs-value" id="sumPurchase">৳০</div>
      </div>
      <div class="goods-summary-box gs-cost">
        <div class="gs-label" id="labelCost">মোট খরচ</div>
        <div class="gs-value" id="sumCost">৳০</div>
      </div>
      <div class="goods-summary-box gs-due">
        <div class="gs-label" id="labelDue">মোট বাকি</div>
        <div class="gs-value" id="sumDue">৳০</div>
      </div>
      <div class="goods-summary-box gs-paid">
        <div class="gs-label" id="labelPaid">মোট বাকি প্রদান</div>
        <div class="gs-value" id="sumPaid">৳০</div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr id="tableHead">
              <th>তারিখ</th>
              <th>দোকান</th>
              <th>বিবরণ</th>
              <th style="text-align:right;">মূল্য</th>
              <th style="text-align:right;">নগদ</th>
              <th style="text-align:right;">বাকি</th>
              <th style="text-align:right;">বাকি প্রদান</th>
              <th style="text-align:right;">খরচ</th>
              <th>মন্তব্য</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState">
        <div class="icon">📋</div>
        <p>এখনো কোনো ডেটা যোগ করা হয়নি</p>
      </div>
    </div>
  </div>

  <!-- ========== FAB + BOTTOM TABS ========== -->
  <button class="fab" id="fabBtn" onclick="fabNewEntry()" style="background:#0F766E;">+</button>

  <div class="bottom-tabs">
    <button class="tab-btn active" id="tabForm" onclick="switchTab('form')" style="color:#0F766E;">মালামাল ক্রয়</button>
    <button class="tab-btn" id="tabStats" onclick="switchTab('stats')">Statistics</button>
  </div>

</div>

<!-- ========== TOAST ========== -->
<div class="toast" id="toast"></div>

<script src="js/common.js"></script>
<script src="js/goods.js"></script>
</body>
</html>
