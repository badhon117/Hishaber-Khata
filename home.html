<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1E3A8A">
<title>বাসার হিসাব — হিসাবের খাতা</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/sync.js"></script>
</head>
<body>

<div class="app">

  <!-- ========== HEADER ========== -->
  <div class="header">
    <button class="back-btn" onclick="goHomePage()">←</button>
    <h1>বাসার হিসাব</h1>
	<button class="header-icon-btn" id="headerMathHintBtn" onclick="toggleMathHint(); updateHeaderHintBtn();" title="হিন্ট চালু/বন্ধ" style="font-size: 16px;">💡 Hint</button>
  </div>

  <!-- ========== FORM TAB ========== -->
  <div id="formTab" class="screen" style="padding-bottom:100px;">
    <div class="form-card">
      <h2>
        <span id="formTitle">নতুন খরচ যোগ করুন</span>
        <span id="editBadge" class="edit-badge" style="display:none;">এডিট মোড</span>
      </h2>

      <input type="hidden" id="editId">

      <div class="form-group">
        <label>তারিখ <span class="req">*</span></label>
        <input type="date" id="fDate">
        <div class="date-bn" id="dateBn"></div>
      </div>

      <div class="form-group">
        <label>খাতের ধরন <span class="req">*</span></label>
        <div class="cat-picker">
          <button type="button" class="cat-trigger placeholder" id="catTrigger" onclick="toggleCatPanel(event)">
            <span id="catTriggerText">-- নির্বাচন করুন --</span>
            <span class="arrow">▼</span>
          </button>
          <div class="cat-panel" id="catPanel">
            <input type="text" class="cat-search" id="catSearch" placeholder="🔍 খুঁজুন..." oninput="renderCatList()">
            <div class="cat-list" id="catList"></div>
            <div class="cat-add">
              <button type="button" class="cat-add-btn" id="catAddBtn" onclick="showAddCatForm(event)">
                ➕ নতুন খাত যোগ করুন
              </button>
              <div class="cat-add-form" id="catAddForm">
                <input type="text" id="catNewInput" placeholder="নতুন খাতের নাম" onkeydown="if(event.key==='Enter'){event.preventDefault();addNewCat();}">
                <button type="button" class="ok" onclick="addNewCat()">যোগ</button>
                <button type="button" class="no" onclick="hideAddCatForm(event)">✕</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>বিবরণ <span class="opt">(ঐচ্ছিক)</span></label>
        <input type="text" id="fDescription" placeholder="সংক্ষিপ্ত বিবরণ লিখুন">
      </div>

      <div class="form-group">
        <label>পরিমাণ (টাকা) <span class="req">*</span></label>
        <input type="text" id="fAmount" placeholder="0" autocomplete="off">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>ক্যাশ</label>
          <input type="text" id="fCash" placeholder="0"   autocomplete="off">
        </div>
        <div class="form-group">
          <label>বিকাশ</label>
          <input type="text" id="fBkash" placeholder="0"   autocomplete="off">
        </div>
      </div>
      <div class="amount-hint" id="amountHint"></div>

      <div class="form-group">
        <label>মন্তব্য <span class="opt">(ঐচ্ছিক)</span></label>
        <textarea id="fNote" placeholder="অতিরিক্ত মন্তব্য"></textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-cancel" onclick="cancelForm()">Cancel</button>
        <button class="btn btn-save" onclick="saveEntry()">Save</button>
        <button class="btn btn-delete" id="deleteBtn" onclick="deleteCurrent()" style="display:none;">Delete</button>
      </div>
    </div>
  </div>

  <!-- ========== STATISTICS TAB ========== -->
  <div id="statsTab" class="screen hidden" style="padding-bottom:100px;">

    <div class="selection-bar" id="selectionBar">
      <div class="count" id="selCount">০টি নির্বাচিত</div>
      <button class="select-all" onclick="toggleSelectAll()">সব</button>
      <button onclick="exitSelectMode()">Cancel</button>
      <button class="danger" onclick="deleteSelected()">Delete</button>
    </div>

    <div class="toolbar">
      <input type="text" class="search-box" id="searchBox" placeholder="🔍 বিবরণ বা মন্তব্য খুঁজুন..." oninput="renderTable()">

      <div class="toolbar-row">
        <button class="tool-btn" id="filterBtn" onclick="toggleDropdownPanel('filterPanel','filterBtn')">▼ ফিল্টার</button>
        <button class="tool-btn" id="sortBtn" onclick="toggleDropdownPanel('sortPanel','sortBtn')">↕ সর্ট</button>
        <button class="tool-btn export" onclick="openExportSheet()">📥 এক্সপোর্ট</button>
        <button class="tool-btn select" id="selectBtn" onclick="enterSelectMode()">☑ Select</button>
      </div>

      <div class="dropdown-panel" id="filterPanel">
        <h4>মাস ফিল্টার</h4>
        <select id="filterMonth" onchange="renderTable()">
          <option value="">সব মাস</option>
        </select>
        <h4 style="margin-top:10px;">খাতের ধরন</h4>
        <select id="filterCategory" onchange="renderTable()">
          <option value="">সব খাত</option>
        </select>
      </div>

      <div class="dropdown-panel" id="sortPanel">
        <h4>সর্ট করুন</h4>
        <select id="sortBy" onchange="renderTable()">
          <option value="date-desc">তারিখ (নতুন → পুরনো)</option>
          <option value="date-asc">তারিখ (পুরনো → নতুন)</option>
          <option value="amount-desc">পরিমাণ (বেশি → কম)</option>
          <option value="amount-asc">পরিমাণ (কম → বেশি)</option>
          <option value="category">খাতের ধরন</option>
        </select>
      </div>
    </div>

    <!-- SUMMARY GRID (২টা আলাদা কার্ড) -->
<div class="home-summary-grid">
  <div class="home-summary-box hs-total">
    <div class="hs-label" id="labelTotal">মোট খরচ</div>
    <div class="hs-value" id="sumTotal">৳০</div>
  </div>
  <div class="home-summary-box hs-count">
    <div class="hs-label" id="labelCount">মোট এন্ট্রি</div>
    <div class="hs-value" id="sumCount">০</div>
  </div>
</div>
	
	<div class="print-page-header" id="printHeaderText">বাসার হিসাব | হিসাবের খাতা</div>
	
	    <!-- চার্ট দেখার বাটন -->
    <div style="text-align: right; margin-bottom: 10px;" class="chartModal">
      <button onclick="openChartModal()" style="background: #1E3A8A; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: inherit;">
        📊 চার্ট দেখুন
      </button>
    </div>

    <!-- চার্টের জন্য মডাল (পপআপ) -->
    <div id="chartModal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px;">
      <div style="background: white; border-radius: 16px; padding: 20px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h3 style="margin: 0; color: #1E3A8A; font-size: 16px;">খাত অনুযায়ী খরচ</h3>
          <button onclick="closeChartModal()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #64748B;">✕</button>
        </div>
        
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
          <select id="chartMonth" onchange="renderChart()" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #CBD5E1; font-family: inherit;">
            <option value="">-- মাস --</option>
          </select>
          <select id="chartYear" onchange="renderChart()" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #CBD5E1; font-family: inherit;">
            <option value="">-- বছর --</option>
          </select>
        </div>

        <div style="position: relative; height: 300px; width: 100%;">
          <canvas id="myChart"></canvas>
        </div>
      </div>
    </div>
	
    <div class="table-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr id="tableHead">
              <th>তারিখ</th>
              <th>খাত</th>
              <th>বিবরণ</th>
              <th style="text-align:right;">পরিমাণ</th>
              <th style="text-align:right;">ক্যাশ</th>
              <th style="text-align:right;">বিকাশ</th>
              <th>মন্তব্য</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState">
        <div class="icon">📋</div>
        <p>এখনো কোনো ডেটা যোগ করা হয়নি</p>
      </div>
    </div>
  </div>

  <!-- ========== FAB + BOTTOM TABS ========== -->
  <button class="fab" id="fabBtn" onclick="fabNewEntry()">+</button>

  <div class="bottom-tabs">
    <button class="tab-btn active" id="tabForm" onclick="switchTab('form')">বাসার হিসাব</button>
    <button class="tab-btn" id="tabStats" onclick="switchTab('stats')">Statistics</button>
  </div>

</div>

<!-- ========== TOAST ========== -->
<div class="toast" id="toast"></div>

<!-- ========== EXPORT BOTTOM SHEET ========== -->

<div class="sheet-overlay" id="exportOverlay" onclick="closeExportSheet()"></div>
<div class="bottom-sheet" id="exportSheet">
  <div class="sheet-drag"></div>
  <div class="sheet-title">ফাইল এক্সপোর্ট করুন</div>
  
  <div class="sheet-options" style="justify-content: center; gap: 20px;">
    <button class="sheet-btn" onclick="exportPDF()" style="flex: 0 1 120px;">
      <span class="icon">📄</span>
      <span class="text">PDF</span>
    </button>
    <button class="sheet-btn" onclick="exportCSV()" style="flex: 0 1 120px;">
      <span class="icon">📊</span>
      <span class="text">CSV</span>
    </button>
  </div>
  
  <button class="sheet-cancel" onclick="closeExportSheet()">বাতিল করুন</button>
</div>


<script src="js/common.js"></script>
<script src="js/home.js"></script>
<!-- Chart.js Library -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- ========== THEME MODAL ========== -->
<div class="theme-modal-overlay" id="themeModalOverlay" onclick="if(event.target === this) closeThemeModal()">
  <div class="theme-modal">
    <h3>🎨 থিম পরিবর্তন করুন</h3>
    
    <button class="theme-option" data-theme="light" onclick="setTheme('light')">
      <span class="icon">☀️</span> লাইট মোড (সাদা)
    </button>
    
    <button class="theme-option" data-theme="dark" onclick="setTheme('dark')">
      <span class="icon">🌙</span> ডার্ক মোড (গাঢ়)
    </button>
    
    <button class="theme-option" data-theme="amoled" onclick="setTheme('amoled')">
      <span class="icon">🌑</span> অ্যামোলেড (একদম কালো)
    </button>
    
    <button class="sheet-cancel" onclick="closeThemeModal()" style="margin-top: 15px;">বাতিল করুন</button>
  </div>
</div>
</body>
</html>
